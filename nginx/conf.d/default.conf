# Only send "Connection: upgrade" when the client actually asked for a
# WebSocket upgrade; n8n's editor UI and Jenkins' consoles need this.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy settings for all upstreams.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 30s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;
proxy_buffering       off;
proxy_redirect        off;

client_max_body_size 512m;

# Default server: anything that isn't a known hostname gets dropped.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name n8n.theshaeffers.com;

    location / {
        proxy_pass http://n8n:5678;
    }
}

server {
    listen 80;
    server_name git.theshaeffers.com;

    location / {
        proxy_pass http://gitea:3000;
    }
}

server {
    listen 80;
    server_name jenkins.theshaeffers.com;

    # Jenkins lives outside Docker on machines that are often asleep, so both
    # upstreams are held in variables and resolved at request time via Docker's
    # embedded DNS. A literal hostname is resolved once at startup and nginx
    # refuses to boot if it misses -- which would take n8n and gitea down too.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Fail over quickly rather than sitting on the default 30s: a sleeping host
    # usually blackholes the SYN instead of refusing it.
    proxy_connect_timeout 3s;

    # The failover chain below is error_page -> error_page. Without this, only
    # the first hop fires: by default nginx will not raise an error page from
    # inside an error page, so a dead devbox would surface as a raw 502.
    recursive_error_pages on;

    # proxy_intercept_errors stays off (the default), so these only fire on
    # nginx-level failures -- DNS miss, refused connection, connect timeout.
    # A 502 returned by Jenkins itself passes straight through to the client.
    location / {
        set $jenkins_primary http://macbookair.lan:8080;
        proxy_pass $jenkins_primary;
        error_page 502 504 = @jenkins_devbox;
    }

    location @jenkins_devbox {
        set $jenkins_devbox http://devbox.lan:8080;
        proxy_pass $jenkins_devbox;
        error_page 502 504 = @jenkins_down;
    }

    location @jenkins_down {
        return 503;
    }

    error_page 503 /jenkins-down.html;

    location = /jenkins-down.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }
}
